services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: gympass
      POSTGRES_DB: gymdb_master
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymdb_master"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # quay.io es el registro propio de MinIO. `minio/minio` en Docker Hub ya no
    # se puede bajar (pull access denied), y la instancia solo seguía
    # levantándolo porque tenía la imagen en caché: recrearla la habría dejado
    # sin almacenamiento de fotos y comprobantes.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - MASTER_DATABASE_URL=postgresql+asyncpg://gymuser:gympass@db:5432/gymdb_master
      - TENANT_DATABASE_URL_TEMPLATE=postgresql+asyncpg://gymuser:gympass@db:5432/{db_name}
      - DATABASE_URL=postgresql+asyncpg://gymuser:gympass@db:5432/gymdb_master
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required. Copy .env.example to .env and fill in values}
      - ENVIRONMENT=development
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Almacenamiento de objetos S3-compatible: MinIO en local, S3 real en prod
      # (basta cambiar estas env vars; el código usa boto3 sin cambios).
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_URL=http://localhost:9000
      - S3_BUCKET=fitconnect-media
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_API_URL se hornea en build-time; pasarlo como build-arg
        # (ya no se filtra vía .env.local del build context).
        NEXT_PUBLIC_API_URL: http://localhost:8000
    command: node server.js
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required. Copy .env.example to .env and fill in values}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
