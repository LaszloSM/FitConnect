services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: gympass
      POSTGRES_DB: gymdb_master
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymdb_master"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO dejó de publicar imágenes (Docker Hub y quay.io responden 401 desde
  # septiembre de 2026). Chainguard la sigue construyendo desde el código y se
  # baja sin cuenta. Corre como uid 65532 y no trae shell ni `mc`: por eso el
  # volumen lo prepara `minio-init` y no hay healthcheck dentro del contenedor.
  minio-init:
    image: busybox:1.36
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - minio_data:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - MASTER_DATABASE_URL=postgresql+asyncpg://gymuser:gympass@db:5432/gymdb_master
      - TENANT_DATABASE_URL_TEMPLATE=postgresql+asyncpg://gymuser:gympass@db:5432/{db_name}
      - DATABASE_URL=postgresql+asyncpg://gymuser:gympass@db:5432/gymdb_master
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required. Copy .env.example to .env and fill in values}
      - ENVIRONMENT=development
      # Igual que en producción: un `docker compose up` sobre una base limpia
      # tiene que dar una app que funcione. Sin esto el Master no tiene tablas
      # y `POST /auth/register` devuelve 500 ('relation "owners" does not
      # exist'); en local no se notaba porque el volumen ya traía el esquema.
      - RUN_MIGRATIONS_ON_STARTUP=true
      - MFA_REQUIRED_ROLES=${MFA_REQUIRED_ROLES:-[]}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Almacenamiento de objetos S3-compatible: MinIO en local, S3 real en prod
      # (basta cambiar estas env vars; el código usa boto3 sin cambios).
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_URL=http://localhost:9000
      - S3_BUCKET=fitconnect-media
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_REGION=us-east-1
      # Los correos van a Mailpit: se ven en http://localhost:8025 tal cual llegan.
      - MAIL_BACKEND=smtp
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started

  # Bandeja de correos de desarrollo: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_API_URL se hornea en build-time; pasarlo como build-arg
        # (ya no se filtra vía .env.local del build context).
        NEXT_PUBLIC_API_URL: http://localhost:8000
    command: node server.js
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required. Copy .env.example to .env and fill in values}
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
