[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Gate de lint: errores de pyflakes (F) y pycodestyle (E/W). Línea larga (E501)
# queda fuera por ahora para no reformatear todo el código en esta fase.
select = ["E", "F", "W"]
ignore = ["E501"]
