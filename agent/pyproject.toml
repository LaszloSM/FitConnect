[project]
name = "fitconnect-agent"
version = "0.1.0"
description = "Agente local de FitConnect: conecta torniquetes Hikvision y ZKTeco (red local) con la nube"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
zk = ["pyzk==0.9"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fitconnect-agent = "fitconnect_agent.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
