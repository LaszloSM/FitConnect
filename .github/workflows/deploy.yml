name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_BACKEND: ${{ secrets.ECR_BACKEND }}
  ECR_FRONTEND: ${{ secrets.ECR_FRONTEND }}

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymuser
          POSTGRES_PASSWORD: gympass
          POSTGRES_DB: gymdb_master
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymuser -d gymdb_master"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MASTER_DATABASE_URL: postgresql+asyncpg://gymuser:gympass@localhost:5432/gymdb_master
      TENANT_DATABASE_URL_TEMPLATE: postgresql+asyncpg://gymuser:gympass@localhost:5432/{db_name}
      DATABASE_URL: postgresql+asyncpg://gymuser:gympass@localhost:5432/gymdb_master
      TEST_DB_URL: postgresql+asyncpg://gymuser:gympass@localhost:5432/gymdb_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-test-secret-key
      ENVIRONMENT: development
      # El 2FA obligatorio se prueba aparte (test_account_security.py).
      MFA_REQUIRED_ROLES: '[]'
      # Almacenamiento de objetos: sin esto el test que sube un video falla con
      # "Unable to locate credentials" y nadie se enteraba, porque el lint de
      # ruff reventaba antes de llegar a pytest.
      S3_ENDPOINT_URL: http://localhost:9000
      S3_PUBLIC_URL: http://localhost:9000
      S3_BUCKET: fitconnect-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff)
        run: cd backend && ruff check app

      - name: Provision databases
        env:
          PGPASSWORD: gympass
        run: |
          # gymuser ya es superusuario del contenedor de servicio; CREATEDB es
          # necesario para que los tests provisionen tenant DBs dinámicamente.
          psql -h localhost -U gymuser -d gymdb_master -c "ALTER USER gymuser CREATEDB;"
          psql -h localhost -U gymuser -d gymdb_master -c "CREATE DATABASE gymdb_test;"

      # MinIO no va en `services:` porque necesita el comando `server /data` y
      # los service containers de Actions no admiten `command`. La imagen es la
      # de Chainguard: MinIO cerró la suya en Docker Hub y en quay.io.
      - name: Almacenamiento de objetos (MinIO)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && echo "MinIO listo" && exit 0
            sleep 2
          done
          docker logs minio
          exit 1

      - name: Run master migrations
        run: cd backend && alembic upgrade head

      - name: Tests
        run: cd backend && pytest --cov=app tests/

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci

      - name: Lint (eslint)
        run: cd frontend && npm run lint

      # El contraste se degradaba sin que nadie se enterara: el volt como texto
      # daba 1.8:1 sobre tarjeta blanca. Ahora se mide en cada push.
      - name: Contraste de los tokens (claro y oscuro)
        run: cd frontend && npm run check:contrast

      # Tiza tiene un solo acento: ningún componente puede sumar hex ni paletas
      # de Tailwind. La deuda vieja está congelada y solo puede bajar.
      - name: Colores escritos a mano (sin deuda nueva)
        run: cd frontend && npm run check:colors

      - run: cd frontend && npm run build
      # Panel de plataforma (admin.<dominio>): app aparte, se compila aparte.
      - name: Panel de plataforma
        run: cd platform && npm ci && npm run build
      - name: Install Playwright
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Start services
        run: docker compose up -d
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Las pruebas e2e entran como dueño sin pasar por el 2FA; el flujo de
          # dos pasos tiene sus propias pruebas en el backend.
          MFA_REQUIRED_ROLES: '[]'
      - name: Wait for services
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && echo "Frontend ready" && break
            echo "Waiting... attempt $i"
            sleep 3
          done
      # Un torniquete ZKTeco emulado para qa-torniquete.spec.ts: se queda
      # conectado y espera a que la prueba registre su serial.
      - name: Torniquete emulado
        run: |
          pip install --quiet httpx
          nohup python backend/scripts/zk_adms_emulator.py --api http://localhost:8000 --sn QA-EMU-0001 --loop 900 \
            > emulador.log 2>&1 &
      - run: cd frontend && npx playwright test

  # Las imágenes se construyen en cada PR aunque no se despliegue: un Dockerfile
  # roto o una imagen de terceros que desapareció (como pasó con MinIO) se ve
  # aquí y no el día que se recrea el servidor.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Imagen del panel de plataforma
        uses: docker/build-push-action@v6
        with:
          context: ./platform
          push: false
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform
      - name: Compose de producción válido y sus imágenes de terceros descargables
        env:
          BACKEND_IMAGE: backend:ci
          FRONTEND_IMAGE: frontend:ci
          PLATFORM_IMAGE: platform:ci
        run: |
          docker compose -f deploy/docker-compose.prod.yml config --quiet
          for img in $(docker compose -f deploy/docker-compose.prod.yml config --images | grep -v ':ci$' | sort -u); do
            echo "Descargando $img"
            docker pull --quiet "$img"
          done

  deploy:
    needs: [test-backend, test-frontend, docker-build]
    # Solo despliega cuando AWS está configurado. Activar creando la variable de
    # repositorio AWS_DEPLOY_ENABLED=true (Settings > Secrets and variables >
    # Actions > Variables) junto con los secrets ECR_*/AWS_DEPLOY_ROLE_ARN.
    if: github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_BACKEND:${{ github.sha }} ./backend
          docker push $ECR_REGISTRY/$ECR_BACKEND:${{ github.sha }}

      - name: Build, tag, and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            -t $ECR_REGISTRY/$ECR_FRONTEND:${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/$ECR_FRONTEND:${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: infra
        run: terraform init

      - name: Deploy
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="backend_image_tag=${{ github.sha }}" \
            -var="frontend_image_tag=${{ github.sha }}"
