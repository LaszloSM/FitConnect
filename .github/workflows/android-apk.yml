# APK de la app para instalar sin Play Store (GitHub Releases), sin EAS ni
# cuentas pagas. Se dispara a mano (Actions › App Android › Run workflow) o al
# subir un tag `app-v*`. En los PR que tocan `mobile/` solo compila, para saber
# que el APK sigue armándose.
#
# Configuración del repo (Settings › Secrets and variables › Actions):
#   Variables: APP_API_URL (https://api.tu-dominio), APP_WEB_URL (https://tu-dominio)
#   Secrets (opcionales, para firmar): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Sin la llave el APK sale firmado con la de depuración y el release queda como
# «prueba»: sirve para probar, pero no para actualizar a los usuarios después.
name: App Android (APK)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL del backend (vacío = variable APP_API_URL)"
        required: false
      publish:
        description: "Publicar el APK como Release"
        type: boolean
        default: true
  push:
    tags: ["app-v*"]
  # En un PR que toca la app solo se comprueba que compile (sin publicar).
  pull_request:
    paths: ["mobile/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.APP_API_URL || (github.event_name == 'pull_request' && 'https://api.example.invalid' || '') }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.APP_WEB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar la URL del backend
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Falta la URL del backend: crea la variable APP_API_URL o pásala al lanzar el workflow."
            exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in
            https://*) ;;
            *) echo "::warning::La URL del backend no es https: Android bloquea el tráfico sin cifrar en release." ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "FC_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK se firma con la llave de depuración (solo para pruebas)."
            echo "SIGNED=0" >> "$GITHUB_ENV"
          fi

      - name: Proyecto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install --clean

      - name: Compilar APK
        working-directory: mobile/android
        env:
          FC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Nombre del archivo
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "lsmfit-$VERSION.apk"
          sha256sum "lsmfit-$VERSION.apk" | tee "lsmfit-$VERSION.apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lsmfit-apk
          path: |
            mobile/lsmfit-*.apk
            mobile/lsmfit-*.apk.sha256
          retention-days: 30

      - name: Publicar Release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/app-v') || inputs.publish)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('app-v{0}-{1}', env.VERSION, github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: LSMFit ${{ env.VERSION }} (Android)${{ env.SIGNED == '1' && '' || ' · prueba' }}
          prerelease: ${{ env.SIGNED != '1' }}
          files: |
            mobile/lsmfit-*.apk
            mobile/lsmfit-*.apk.sha256
          body: |
            APK para instalar LSMFit en Android sin Play Store.

            1. Abre este enlace desde el celular y descarga `lsmfit-${{ env.VERSION }}.apk`.
            2. Android pedirá permiso para instalar apps de esta fuente: acéptalo solo para el navegador que usaste.
            3. Si Play Protect avisa que la app es desconocida, toca «Más detalles › Instalar de todas formas».

            Backend: `${{ env.EXPO_PUBLIC_API_URL }}`. ${{ env.SIGNED == '1' && 'Firmado con la llave del proyecto.' || 'Firmado con la llave de depuración: solo para pruebas, las versiones firmadas no se instalan encima de esta.' }}
