# Rotación de logs: json-file sin límite llenaba el disco de la instancia sin aviso.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gymdb_master
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymdb_master"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: always
    logging: *default-logging
    command: server /data
    environment:
      MINIO_ROOT_USER: fitconnect
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    restart: always
    logging: *default-logging
    environment:
      - MASTER_DATABASE_URL=postgresql+asyncpg://gymuser:${DB_PASSWORD}@db:5432/gymdb_master
      - TENANT_DATABASE_URL_TEMPLATE=postgresql+asyncpg://gymuser:${DB_PASSWORD}@db:5432/{db_name}
      - DATABASE_URL=postgresql+asyncpg://gymuser:${DB_PASSWORD}@db:5432/gymdb_master
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - RUN_MIGRATIONS_ON_STARTUP=true
      - CORS_ORIGINS=["${PUBLIC_URL}"]
      - FRONTEND_URL=${PUBLIC_URL}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_URL=${PUBLIC_URL}:9000
      - S3_BUCKET=fitconnect-media
      - S3_ACCESS_KEY=fitconnect
      - S3_SECRET_KEY=${MINIO_PASSWORD}
      - S3_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: always
    logging: *default-logging
    environment:
      - NEXTAUTH_URL=${PUBLIC_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${PUBLIC_URL}
      - API_URL=http://backend:8000
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  caddy_data:
