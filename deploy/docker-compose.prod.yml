# Rotación de logs: json-file sin límite llenaba el disco de la instancia sin aviso.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: gymuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gymdb_master
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymuser -d gymdb_master"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO dejó de publicar imágenes (Docker Hub y quay.io responden 401 desde
  # septiembre de 2026); la instancia solo seguía viva por la imagen en caché.
  # Chainguard la construye desde el código y se baja sin cuenta. Corre como
  # uid 65532: `minio-init` le pasa el volumen que dejó la imagen vieja (root).
  minio-init:
    image: busybox:1.36
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - minio_data:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: always
    logging: *default-logging
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: fitconnect
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    # Sin puerto publicado: fotos y comprobantes salen por Caddy (/fitconnect-media/*).
    volumes:
      - minio_data:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  backend:
    image: ${BACKEND_IMAGE}
    restart: always
    logging: *default-logging
    environment:
      - MASTER_DATABASE_URL=postgresql+asyncpg://gymuser:${DB_PASSWORD}@db:5432/gymdb_master
      - TENANT_DATABASE_URL_TEMPLATE=postgresql+asyncpg://gymuser:${DB_PASSWORD}@db:5432/{db_name}
      - DATABASE_URL=postgresql+asyncpg://gymuser:${DB_PASSWORD}@db:5432/gymdb_master
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - ENVIRONMENT=production
      - RUN_MIGRATIONS_ON_STARTUP=true
      - CORS_ORIGINS=["${PUBLIC_URL}"]
      - FRONTEND_URL=${PUBLIC_URL}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_URL=${PUBLIC_URL}
      - PLATFORM_URL=${PLATFORM_URL:-http://localhost:9100}
      - SES_FROM_EMAIL=${SES_FROM_EMAIL:-}
      - S3_BUCKET=fitconnect-media
      - S3_ACCESS_KEY=fitconnect
      - S3_SECRET_KEY=${MINIO_PASSWORD}
      - S3_REGION=us-east-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: always
    logging: *default-logging
    environment:
      - NEXTAUTH_URL=${PUBLIC_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${PUBLIC_URL}
      - API_URL=http://backend:8000
    depends_on:
      - backend

  platform:
    # Panel de plataforma (admin.<dominio>). Llama a la API por su mismo origen
    # (/api/platform/* lo enruta Caddy), así que no necesita CORS ni cookies.
    image: ${PLATFORM_IMAGE}
    restart: always
    logging: *default-logging
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *default-logging
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-:80}
      - PLATFORM_ADDRESS=${PLATFORM_ADDRESS:-:9100}
      - PLATFORM_ALLOWED_IPS=${PLATFORM_ALLOWED_IPS:-0.0.0.0/0 ::/0}
      - ICLOCK_HTTP_ADDRESS=${ICLOCK_HTTP_ADDRESS:-:8088}
    ports:
      - "80:80"
      - "443:443"
      # Sin dominio, el panel de plataforma solo se abre por túnel SSH:
      #   ssh -L 9100:localhost:9100 ec2-user@<ip>  →  http://localhost:9100
      - "127.0.0.1:9100:9100"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - frontend
      - platform

volumes:
  postgres_data:
  minio_data:
  caddy_data:
